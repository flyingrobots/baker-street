# This profile covers the new installation path; it is not a legacy-tree waiver.
target-version = "py310"
include = ["scripts/install.py", "scripts/install_paths.py", "scripts/release_payload.py", "tests/*install*.py", "verification/check_install_coverage.py"]

[lint]
select = [
  "E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "C90",
  "N", "S", "BLE", "A", "ARG", "RUF", "D", "ANN", "RET", "TRY",
  "PERF", "FBT", "TID", "PT", "T20", "ASYNC", "PGH", "DTZ", "G", "LOG",
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLW0120",
]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"tests/test_install_workflow.py" = ["PT009"] # INSTALL-WORKFLOW-PT009: unittest assertions.
"tests/test_install_coverage.py" = ["PT009", "PT027"] # INSTALL-COVERAGE-PT009: unittest assertions; INSTALL-COVERAGE-PT027: unittest exception contexts.
"tests/test_install_admission.py" = ["PT009", "PT027"] # INSTALL-ADMISSION-PT009: unittest assertions; INSTALL-ADMISSION-PT027: unittest exception contexts.
"tests/test_install_command.py" = ["PT009"] # INSTALL-COMMAND-PT009: unittest assertions.
"tests/test_install_payload.py" = ["PT009"] # INSTALL-PAYLOAD-PT009: unittest assertions.
"tests/test_install_preservation.py" = ["PT009", "PT027"] # INSTALL-PRESERVATION-PT009: unittest assertions; INSTALL-PRESERVATION-PT027: unittest exception contexts.

[lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Keep untrusted values as object until admission."
"typing_extensions.Any".msg = "Keep untrusted values as object until admission."
"pickle".msg = "Object deserialization requires a separately reviewed boundary."
"marshal".msg = "Interpreter object serialization is not an admission protocol."
"builtins.eval".msg = "Do not execute input data."
"builtins.exec".msg = "Do not execute input data."
