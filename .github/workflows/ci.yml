name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run harness and packet tests
        run: make test
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          # Keep unattended maintenance outside the preservation examination.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: maintenance.auto
          GIT_CONFIG_VALUE_0: 'false'

  preference-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.15'
      - name: Prepare the pinned examination tools
        run: python -m pip install --require-hashes -r verification/requirements.txt
      - name: Examine the preference source format
        run: ruff format --check --config verification/ruff.toml .
      - name: Examine the preference source rules
        run: ruff check --config verification/ruff.toml .
      - name: Examine the preference types
        run: pyright --project verification/pyrightconfig.json
      - name: Measure the preference component and its admission instrument
        run: |
          coverage erase
          coverage run --branch --source=scripts.preference_schema,scripts.preference_file,scripts.preference_roots,scripts.preference_header,scripts.prepare_header,verification.check_preferences,verification.preference_coverage,verification.preference_exceptions,verification.preference_proofs,verification.preference_suppressions -m unittest discover -s tests -p 'test_preference*.py'
          coverage json -o preference-coverage.json
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Admit coverage and exception records
        run: python -m verification.check_preferences --coverage preference-coverage.json
      - name: Retain the measured coverage inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preference-coverage
          path: preference-coverage.json
          if-no-files-found: error
          retention-days: 7
      - name: Examine admission with assertions disabled
        run: python -O -m unittest discover -s tests -p 'test_preference*.py'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
